<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guitar Trainer - Rocksmith Style</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;background:#101114;color:#eee;
    font-family:Arial,sans-serif;padding:18px
  }
  .app{max-width:800px;margin:auto}
  h1{text-align:center}
  .card{
    background:#1b1d22;border:1px solid #333;
    border-radius:14px;padding:18px;margin:14px 0
  }
  textarea{
    width:100%;height:130px;background:#0c0d0f;color:#fff;
    border:1px solid #444;border-radius:10px;padding:12px;
    font:16px monospace
  }
  .controls-row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
  label{font-size:14px;color:#ccc}
  input[type="number"]{
    background:#0c0d0f;color:#fff;border:1px solid #444;
    padding:8px;border-radius:6px;width:70px
  }
  button{
    border:0;border-radius:10px;padding:12px 18px;
    font-size:16px;cursor:pointer;font-weight:bold
  }
  #start{background:#35c46a;color:#07130b}
  #stop{background:#d95353;color:white}
  
  /* Area de Jogo Estilo Rocksmith */
  .game-display{
    background:#090a0c;border:2px solid #333;border-radius:12px;
    padding:20px;text-align:center;position:relative;overflow:hidden
  }
  .target-note{font-size:80px;font-weight:bold;color:#4da3ff;margin:10px 0}
  .detected-note{font-size:24px;color:#888;height:30px}
  
  /* Barra de Tempo do Hit Window */
  .time-bar-container{
    width:100%;height:10px;background:#222;border-radius:5px;
    margin:15px 0;overflow:hidden
  }
  #time-progress{
    height:100%;width:0%;background:#4da3ff;transition:width 0.05s linear
  }
  
  .status{font-size:22px;font-weight:bold;min-height:30px;margin:10px 0}
  .status.ok{color:#5ee68b}
  .status.bad{color:#ff7272}
  .status.waiting{color:#e6c85e}

  .score-board{
    display:flex;justify-content:space-around;
    background:#111318;padding:12px;border-radius:8px;font-size:18px
  }
</style>
</head>

<body>
<div class="app">

<h1>🎸 Rocksmith Web Trainer</h1>

<div class="card">
  <h2>1. Tablatura & Configurações</h2>
  <textarea id="tab">e|--0--1--3--1--0--|
B|-----------------|
G|-----------------|
D|-----------------|
A|-----------------|
E|-----------------|</textarea>

  <div class="controls-row">
    <label>Tempo (BPM): 
      <input type="number" id="bpm" value="60" min="30" max="240">
    </label>
    <button id="start">▶️ Iniciar Jogo</button>
    <button id="stop">⏹ Parar</button>
  </div>
</div>

<div class="card">
  <h2>2. Palco</h2>
  
  <div class="game-display">
    <div>TOQUE AGORA:</div>
    <div class="target-note" id="expected">—</div>
    
    <div class="time-bar-container">
      <div id="time-progress"></div>
    </div>

    <div class="detected-note">Ouvindo: <span id="detected">—</span> (<span id="freq">—</span> Hz)</div>
    <div class="status" id="result">Aguardando início...</div>
  </div>

  <br>
  <div class="score-board">
    <div>Acertos: <strong id="hits" style="color:#5ee68b">0</strong></div>
    <div>Erros: <strong id="errors" style="color:#ff7272">0</strong></div>
    <div>Nota: <span id="current-step">0</span>/<span id="total-steps">0</span></div>
  </div>
</div>

</div>

<script>
const tabInput = document.getElementById("tab");
const bpmInput = document.getElementById("bpm");
const expectedEl = document.getElementById("expected");
const detectedEl = document.getElementById("detected");
const freqEl = document.getElementById("freq");
const resultEl = document.getElementById("result");
const timeProgress = document.getElementById("time-progress");
const hitsText = document.getElementById("hits");
const errorsText = document.getElementById("errors");
const currentStepEl = document.getElementById("current-step");
const totalStepsEl = document.getElementById("total-steps");

let audioContext, analyser, source, filter, stream;
let running = false;
let notes = [];
let currentIndex = 0;
let hits = 0;
let errors = 0;

let noteTimer = null;
let noteStartTime = 0;
let noteDurationMs = 1000;
let hitInCurrentWindow = false;

const TOLERANCE_CENTS = 30; // Tolerância para pequenas desafinações
const noteNames = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

function parseTab(){
  const text = tabInput.value;
  const lines = text.split("\n");
  const parsed = [];

  for(const line of lines){
    const m = line.match(/^([eEBGAD])\|(.+)\|?$/);
    if(!m) continue;

    const stringChar = m[1];
    const content = m[2];
    const regex = /(\d+)/g;
    let match;

    while((match = regex.exec(content))){
      const fret = parseInt(match[1]);
      let base;

      if(stringChar === "E") base = 40;      // 6ª corda (E2)
      else if(stringChar === "A") base = 45; // 5ª corda (A2)
      else if(stringChar === "D") base = 50; // 4ª corda (D3)
      else if(stringChar === "G") base = 55; // 3ª corda (G3)
      else if(stringChar === "B") base = 59; // 2ª corda (B3)
      else if(stringChar === "e") base = 64; // 1ª corda (E4)
      else continue;

      const midi = base + fret;
      const frequency = 440 * Math.pow(2, (midi - 69) / 12);

      parsed.push({
        midi,
        frequency,
        note: noteNames[midi % 12]
      });
    }
  }
  return parsed;
}

function frequencyToNote(freq){
  if(!freq || freq < 60 || freq > 1200) return null;

  const midiExact = 69 + 12 * Math.log2(freq / 440);
  const midi = Math.round(midiExact);
  const note = noteNames[((midi % 12) + 12) % 12];
  const octave = Math.floor(midi / 12) - 1;
  const exactFreq = 440 * Math.pow(2, (midi - 69) / 12);
  const cents = 1200 * Math.log2(freq / exactFreq);

  return { note, octave, midi, frequency: freq, cents };
}

function detectPitch(buffer, sampleRate){
  let SIZE = buffer.length;
  let rms = 0;
  for(let i=0; i<SIZE; i++) rms += buffer[i]*buffer[i];
  rms = Math.sqrt(rms/SIZE);

  if(rms < 0.015) return null; // Ignora ruído de fundo

  let bestOffset = -1;
  let bestCorrelation = 0;

  for(let offset = 20; offset < SIZE/2; offset++){
    let correlation = 0;
    for(let i=0; i<SIZE-offset; i++) correlation += buffer[i]*buffer[i+offset];
    correlation /= (SIZE-offset);

    if(correlation > bestCorrelation){
      bestCorrelation = correlation;
      bestOffset = offset;
    }
  }

  if(bestOffset === -1) return null;
  return sampleRate / bestOffset;
}

// Avança para a próxima nota do tempo
function nextNoteStep(){
  if(!running) return;

  // Se a nota anterior terminou e o jogador não acertou
  if(!hitInCurrentWindow && currentIndex < notes.length){
    errors++;
    errorsText.textContent = errors;
    resultEl.textContent = "✗ ERROU (Tempo esgotado)";
    resultEl.className = "status bad";
  }

  currentIndex++;

  if(currentIndex >= notes.length){
    stopGame();
    resultEl.textContent = "🎉 FIM DA MÚSICA!";
    resultEl.className = "status ok";
    return;
  }

  startNoteWindow();
}

function startNoteWindow(){
  hitInCurrentWindow = false;
  const current = notes[currentIndex];
  
  expectedEl.textContent = current.note;
  currentStepEl.textContent = currentIndex + 1;

  resultEl.textContent = "Toque!";
  resultEl.className = "status waiting";

  const bpm = parseInt(bpmInput.value) || 60;
  noteDurationMs = (60 / bpm) * 1000; // Tempo de cada nota em ms
  noteStartTime = Date.now();

  clearTimeout(noteTimer);
  noteTimer = setTimeout(nextNoteStep, noteDurationMs);
}

function checkAudioInput(info){
  if(!info || !running || hitInCurrentWindow) return;

  detectedEl.textContent = info.note + info.octave;
  freqEl.textContent = info.frequency.toFixed(1);

  const target = notes[currentIndex];
  if(!target) return;

  // Aceita a nota exata e tolerância de afinador
  const isCorrectNote = info.note === target.note;
  const isWithinTolerance = Math.abs(info.cents) <= TOLERANCE_CENTS;

  if(isCorrectNote && isWithinTolerance){
    hitInCurrentWindow = true;
    hits++;
    hitsText.textContent = hits;

    resultEl.textContent = "✓ PERFEITO!";
    resultEl.className = "status ok";
  }
}

function gameLoop(){
  if(!running) return;

  // Atualiza a barra de tempo da nota atual
  const elapsed = Date.now() - noteStartTime;
  const progress = Math.min(100, (elapsed / noteDurationMs) * 100);
  timeProgress.style.width = progress + "%";

  // Processa entrada do microfone
  const buffer = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buffer);
  const freq = detectPitch(buffer, audioContext.sampleRate);

  if(freq){
    const info = frequencyToNote(freq);
    if(info) checkAudioInput(info);
  }

  requestAnimationFrame(gameLoop);
}

async function startGame(){
  notes = parseTab();
  if(notes.length === 0){
    alert("Nenhuma nota encontrada na tablatura.");
    return;
  }

  try{
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });

    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    source = audioContext.createMediaStreamSource(stream);

    // FILTRO PASSA-ALTAS (Elimina ruídos graves e evita confusão na 1ª corda Mizinho)
    filter = audioContext.createBiquadFilter();
    filter.type = "highpass";
    filter.frequency.value = 130; 

    analyser = audioContext.createAnalyser();
    analyser.fftSize = 4096;

    source.connect(filter);
    filter.connect(analyser);

    hits = 0; errors = 0; currentIndex = 0;
    hitsText.textContent = "0"; errorsText.textContent = "0";
    totalStepsEl.textContent = notes.length;

    running = true;
    startNoteWindow();
    gameLoop();

  } catch(err){
    console.error(err);
    alert("Erro ao acessar o microfone.");
  }
}

function stopGame(){
  running = false;
  clearTimeout(noteTimer);
  if(stream) stream.getTracks().forEach(t => t.stop());
  if(audioContext) audioContext.close();
  
  timeProgress.style.width = "0%";
  expectedEl.textContent = "—";
}

document.getElementById("start").addEventListener("click", startGame);
document.getElementById("stop").addEventListener("click", stopGame);
</script>

</body>
</html>

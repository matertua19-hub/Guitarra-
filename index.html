<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guitar Trainer - Rocksmith Style</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;background:#101114;color:#eee;
    font-family:Arial,sans-serif;padding:18px
  }
  .app{max-width:850px;margin:auto}
  h1{text-align:center;margin-bottom:20px}
  .card{
    background:#1b1d22;border:1px solid #333;
    border-radius:14px;padding:18px;margin:14px 0
  }
  textarea{
    width:100%;height:160px;background:#0c0d0f;color:#fff;
    border:1px solid #444;border-radius:10px;padding:12px;
    font:15px monospace;line-height:1.3
  }
  .controls-row{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
  label{font-size:14px;color:#ccc}
  input[type="number"]{
    background:#0c0d0f;color:#fff;border:1px solid #444;
    padding:8px;border-radius:6px;width:75px
  }
  button{
    border:0;border-radius:10px;padding:12px 20px;
    font-size:16px;cursor:pointer;font-weight:bold;transition:0.2s
  }
  #start{background:#35c46a;color:#07130b}
  #start:hover{background:#2eb05d}
  #stop{background:#d95353;color:white}
  #stop:hover{background:#c44343}
  
  .game-display{
    background:#090a0c;border:2px solid #333;border-radius:12px;
    padding:20px;text-align:center;position:relative;overflow:hidden
  }
  .target-note{font-size:75px;font-weight:bold;color:#4da3ff;margin:10px 0;min-height:90px}
  .detected-note{font-size:20px;color:#aaa;height:30px}
  
  .time-bar-container{
    width:100%;height:10px;background:#222;border-radius:5px;
    margin:15px 0;overflow:hidden
  }
  #time-progress{
    height:100%;width:0%;background:#4da3ff;transition:width 0.05s linear
  }
  
  .status{font-size:22px;font-weight:bold;min-height:32px;margin:10px 0}
  .status.ok{color:#5ee68b}
  .status.bad{color:#ff7272}
  .status.waiting{color:#e6c85e}

  .score-board{
    display:flex;justify-content:space-around;
    background:#111318;padding:12px;border-radius:8px;font-size:18px
  }
</style>
</head>

<body>
<div class="app">

<h1>🎸 Rocksmith Web Trainer</h1>

<div class="card">
  <h2>1. Tablatura & Configurações</h2>
  <textarea id="tab">E|--12--10----------12--10----------|--8--6--------8--6------|--6--5--------|
B|----------10--------------10------|--------6------------6--|--------6-----|
G|--------------10--------------10--|-----------7------------|-----------7--|
D|----------------------------------|------------------------|--------------|
A|----------------------------------|------------------------|--------------|
E|----------------------------------|------------------------|--------------|</textarea>

  <div class="controls-row">
    <label>Tempo (BPM): 
      <input type="number" id="bpm" value="80" min="30" max="240">
    </label>
    <button id="start">▶️ Iniciar Jogo</button>
    <button id="stop">⏹ Parar</button>
  </div>
</div>

<div class="card">
  <h2>2. Palco</h2>
  
  <div class="game-display">
    <div>TOQUE AGORA:</div>
    <div class="target-note" id="expected">—</div>
    
    <div class="time-bar-container">
      <div id="time-progress"></div>
    </div>

    <div class="detected-note">Ouvindo: <span id="detected">—</span></div>
    <div class="status" id="result">Aguardando início...</div>
  </div>

  <br>
  <div class="score-board">
    <div>Acertos: <strong id="hits" style="color:#5ee68b">0</strong></div>
    <div>Erros: <strong id="errors" style="color:#ff7272">0</strong></div>
    <div>Passo: <span id="current-step">0</span>/<span id="total-steps">0</span></div>
  </div>
</div>

</div>

<script>
const tabInput = document.getElementById("tab");
const bpmInput = document.getElementById("bpm");
const expectedEl = document.getElementById("expected");
const detectedEl = document.getElementById("detected");
const resultEl = document.getElementById("result");
const timeProgress = document.getElementById("time-progress");
const hitsText = document.getElementById("hits");
const errorsText = document.getElementById("errors");
const currentStepEl = document.getElementById("current-step");
const totalStepsEl = document.getElementById("total-steps");

let audioContext, analyser, source, filter, stream;
let running = false;
let notes = [];
let currentIndex = 0;
let hits = 0;
let errors = 0;

let noteTimer = null;
let noteStartTime = 0;
let noteDurationMs = 1000;
let hitInCurrentWindow = false;

const noteNames = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

// Mapeamento e Varredura da Tablatura Coluna por Coluna
function parseTab(){
  const text = tabInput.value;
  const lines = text.split("\n").filter(l => l.trim().length > 0);
  const parsed = [];

  const stringBases = {
    'e': 64, 'B': 59, 'G': 55, 'D': 50, 'A': 45, 'E': 40
  };

  const structuredLines = [];
  for(const line of lines){
    const m = line.match(/^([eEBGAD])\|(.+)\|?$/);
    if(m){
      structuredLines.push({
        stringChar: m[1],
        content: m[2],
        base: stringBases[m[1]]
      });
    }
  }

  if(structuredLines.length === 0) return [];

  const maxLen = Math.max(...structuredLines.map(l => l.content.length));
  let lastNoteCol = -1;

  for(let col = 0; col < maxLen; col++){
    const columnNotes = [];

    for(const line of structuredLines){
      if(col < line.content.length){
        const char = line.content[col];
        
        if(/\d/.test(char)){
          const prevChar = col > 0 ? line.content[col - 1] : '';
          if(/\d/.test(prevChar)) continue; 

          let fretStr = char;
          if(col + 1 < line.content.length && /\d/.test(line.content[col + 1])){
            fretStr += line.content[col + 1];
          }

          const fret = parseInt(fretStr);
          const midi = line.base + fret;

          columnNotes.push(noteNames[midi % 12]);
        }
      }
    }

    if(columnNotes.length > 0){
      const dashDistance = (lastNoteCol === -1) ? 1 : (col - lastNoteCol);
      lastNoteCol = col;

      parsed.push({
        notes: columnNotes,
        displayText: columnNotes.join(" + "),
        durationUnits: dashDistance
      });
    }
  }

  return parsed;
}

function frequencyToNote(freq){
  if(!freq || freq < 60 || freq > 1200) return null;
  const midiExact = 69 + 12 * Math.log2(freq / 440);
  const midi = Math.round(midiExact);
  return noteNames[((midi % 12) + 12) % 12];
}

// Análise Polifônica / Picos de Espectro FFT
function detectNotesFromFFT(analyser, sampleRate){
  const bufferLength = analyser.frequencyBinCount;
  const frequencyData = new Float32Array(bufferLength);
  analyser.getFloatFrequencyData(frequencyData);

  const detected = new Set();
  const threshold = -65; // Limiar dB

  for (let i = 2; i < bufferLength - 2; i++) {
    if (frequencyData[i] > threshold &&
        frequencyData[i] > frequencyData[i - 1] &&
        frequencyData[i] > frequencyData[i + 1]) {

      const freq = i * (sampleRate / analyser.fftSize);
      const note = frequencyToNote(freq);
      if (note) detected.add(note);
    }
  }

  return Array.from(detected);
}

function nextNoteStep(){
  if(!running) return;

  if(!hitInCurrentWindow && currentIndex < notes.length){
    errors++;
    errorsText.textContent = errors;
    resultEl.textContent = "✗ ERROU (Tempo esgotado)";
    resultEl.className = "status bad";
  }

  currentIndex++;

  if(currentIndex >= notes.length){
    stopGame();
    resultEl.textContent = "🎉 FIM DA MÚSICA!";
    resultEl.className = "status ok";
    return;
  }

  startNoteWindow();
}

function startNoteWindow(){
  hitInCurrentWindow = false;
  const current = notes[currentIndex];
  
  expectedEl.textContent = current.displayText;
  currentStepEl.textContent = currentIndex + 1;

  resultEl.textContent = "Toque!";
  resultEl.className = "status waiting";

  const bpm = parseInt(bpmInput.value) || 80;
  const baseBeatMs = (60 / bpm) * 1000;
  const units = current.durationUnits || 1;
  
  noteDurationMs = Math.max(350, (baseBeatMs / 3) * units); 
  noteStartTime = Date.now();

  clearTimeout(noteTimer);
  noteTimer = setTimeout(nextNoteStep, noteDurationMs);
}

function checkAudioInput(detectedNotesList){
  if(!detectedNotesList || detectedNotesList.length === 0 || !running || hitInCurrentWindow) return;

  detectedEl.textContent = detectedNotesList.join(", ");

  const target = notes[currentIndex];
  if(!target) return;

  // Verifica se todas as notas da etapa/acorde foram tocadas
  const allMatch = target.notes.every(n => detectedNotesList.includes(n));

  if(allMatch){
    hitInCurrentWindow = true;
    hits++;
    hitsText.textContent = hits;

    resultEl.textContent = "✓ PERFEITO!";
    resultEl.className = "status ok";
  }
}

function gameLoop(){
  if(!running) return;

  const elapsed = Date.now() - noteStartTime;
  const progress = Math.min(100, (elapsed / noteDurationMs) * 100);
  timeProgress.style.width = progress + "%";

  const detectedNotes = detectNotesFromFFT(analyser, audioContext.sampleRate);
  checkAudioInput(detectedNotes);

  requestAnimationFrame(gameLoop);
}

async function startGame(){
  notes = parseTab();
  if(notes.length === 0){
    alert("Nenhuma nota encontrada na tablatura.");
    return;
  }

  try{
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });

    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    source = audioContext.createMediaStreamSource(stream);

    // Filtro Passa-Altas para isolar a 1ª corda e evitar graves cruzados
    filter = audioContext.createBiquadFilter();
    filter.type = "highpass";
    filter.frequency.value = 120; 

    analyser = audioContext.createAnalyser();
    analyser.fftSize = 4096;

    source.connect(filter);
    filter.connect(analyser);

    hits = 0; errors = 0; currentIndex = 0;
    hitsText.textContent = "0"; errorsText.textContent = "0";
    totalStepsEl.textContent = notes.length;

    running = true;
    startNoteWindow();
    gameLoop();

  } catch(err){
    console.error(err);
    alert("Erro ao acessar o microfone.");
  }
}

function stopGame(){
  running = false;
  clearTimeout(noteTimer);
  if(stream) stream.getTracks().forEach(t => t.stop());
  if(audioContext) audioContext.close();
  
  timeProgress.style.width = "0%";
  expectedEl.textContent = "—";
}

document.getElementById("start").addEventListener("click", startGame);
document.getElementById("stop").addEventListener("click", stopGame);
</script>

</body>
</html>
